name: CI

# Every gate, on every branch. The private monorepo this tree is ejected from pushes each of its
# pull requests to the branch pr/<number> here, so these run before the private merge; cd.yml calls
# this workflow again on main before it publishes.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

# A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium (browser)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F @gut.run/playwright exec playwright install chromium

      - name: Install Playwright OS dependencies
        run: pnpm -F @gut.run/playwright exec playwright install-deps chromium

      - run: pnpm test
      - run: pnpm build
