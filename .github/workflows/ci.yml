name: CI

# Every gate, on every branch. The private monorepo this tree is ejected from pushes each of its
# pull requests to the branch pr/<number> here, so these run before the private merge; cd.yml calls
# this workflow again on main before it publishes.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

# A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tests drive Chromium. Playwright's image holds the browsers and the system libraries they
    # need, so nothing is fetched from the runner's Ubuntu mirror, which has crawled past a job's
    # limit. Its tag must be the catalog's `playwright` (pnpm-workspace.yaml): bump both together.
    # `--user 1001` is Playwright's own setup for this image on GitHub Actions.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -F @gut.run/inspector test:e2e
      - run: pnpm -F @gut.run/site test:e2e
      - run: pnpm build
