<!DOCTYPE html>
<html lang="en">
<head><title>Travel Planner - Layout B</title></head>
<body>
  <main>
    <h1>Travel Planner</h1>
    <form action="/form/layout-b/search" method="POST">
      <fieldset>
        <legend>Flight search</legend>
        <label for="dest2">Destination</label>
        <input id="dest2" name="destination" type="text" />
      </fieldset>
      <fieldset>
        <legend>Dates</legend>
        <label for="dt2">Date</label>
        <input id="dt2" name="date" type="text" />
      </fieldset>
      <fieldset>
        <legend>Discounts</legend>
        <label for="promo2">Promo code</label>
        <input id="promo2" name="promo" type="text" />
      </fieldset>
      <button type="reset">Clear</button>
      <button type="submit">Find Flights</button>
    </form>
  </main>
</body>
</html>
