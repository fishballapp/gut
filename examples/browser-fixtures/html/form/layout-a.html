<!DOCTYPE html>
<html lang="en">
<head><title>Flight Search - Layout A</title></head>
<body>
  <main>
    <h1>Flight Search</h1>
    <form action="/form/layout-a/search" method="POST">
      <div>
        <label for="dest">Destination</label>
        <input id="dest" name="destination" type="text" />
      </div>
      <div>
        <label for="dt">Date</label>
        <input id="dt" name="date" type="text" />
      </div>
      <div>
        <label for="promo">Promo code</label>
        <input id="promo" name="promo" type="text" />
      </div>
      <button type="submit">Search Flights</button>
    </form>
  </main>
</body>
</html>
